# Blueprint Render — back-office Imperial Collection (Django REST + PostgreSQL + Redis).
# Le frontend Next.js n'apparaît pas ici : il est déployé séparément sur Vercel
# (voir /frontend/.env.example pour les variables à y renseigner).
#
# Plan gratuit Render : pas de "background worker" séparé possible (Celery
# worker/beat retirés de ce Blueprint). Les tâches (envoi d'e-mails,
# notifications WhatsApp) s'exécutent donc de façon SYNCHRONE, dans le même
# processus que la requête qui les déclenche — voir CELERY_TASK_ALWAYS_EAGER
# ci-dessous et core/settings/production.py. Conséquence acceptée : les tâches
# planifiées (expiration des réservations de stock, désactivation des coupons)
# ne tournent plus en tâche de fond ; à réintroduire via un vrai worker Celery
# (ou un Render Cron Job) si vous passez sur un plan payant.
#
# Déploiement : sur render.com, "New" → "Blueprint", pointer sur ce dépôt.
# Toute variable marquée `sync: false` doit être saisie manuellement dans le
# dashboard Render après la première création (clés/secrets non versionnés).

databases:
  - name: imperial-db
    plan: free
    databaseName: imperial_collection
    user: imperial_collection

services:
  # ---- Redis (cache / usage futur — Celery en mode "eager" ne s'y connecte plus) ----
  - type: redis
    name: imperial-redis
    plan: free
    ipAllowList: [] # pas d'accès externe : seuls les services de ce Blueprint s'y connectent

  # ---- API Django (web) ----
  - type: web
    name: imperial-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements/production.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_prod_superuser"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    autoDeploy: true
    envVars:
      # Render utilise Python 3.14 par défaut si non précisé — trop récent pour
      # Pillow/psycopg2 à ces versions (échec de compilation au build). Fixé en
      # complément de /backend/.python-version (les deux mécanismes se recoupent
      # selon la façon dont Render détecte la version pour ce type de service).
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # ---- Bootstrap du superutilisateur (create_prod_superuser) ----
      # Pas d'acces Shell sur le plan gratuit Render : ce compte est cree
      # automatiquement au build, une seule fois (la commande est idempotente
      # - sans effet si le compte existe deja). Saisir ces 5 valeurs
      # manuellement dans le dashboard Render ; ne JAMAIS les committer dans
      # le depot. Une fois le compte cree, ces variables peuvent etre
      # supprimees du dashboard sans casser quoi que ce soit.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_FIRST_NAME
        sync: false
      - key: DJANGO_SUPERUSER_LAST_NAME
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      # Domaine(s) exact(s) du frontend en production (ex. https://imperialcollection.com) —
      # les previews Vercel (*.vercel.app) sont déjà couvertes par settings/production.py.
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: imperial-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: imperial-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: imperial-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: imperial-redis
          property: connectionString
      # Pas de worker Celery séparé sur le plan gratuit : les tâches s'exécutent
      # en synchrone dans le processus web (voir settings/production.py). Repasser
      # à "False" seulement si un vrai worker est ajouté (plan payant).
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      # ---- Stockage média (Cloudinary) ----
      - key: MEDIA_STORAGE_BACKEND
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ---- E-mail transactionnel (SMTP Resend / Brevo) ----
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Imperial Collection <notifications@imperialcollection.com>"
      # ---- Paiement Mobile Money (CinetPay) ----
      - key: CINETPAY_API_KEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_SECRET_KEY
        sync: false
      - key: CINETPAY_NOTIFY_URL
        sync: false
      - key: CINETPAY_RETURN_URL
        sync: false
      # ---- WhatsApp ----
      - key: WHATSAPP_ADMIN_PHONE_NUMBER
        value: "237696000388"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # ---- Suivi d'erreurs (optionnel) ----
      - key: SENTRY_DSN
        sync: false
